[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econeval"
version = "0.5.0"
description = "CI/CD checks for economic, policy, and statistical models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "EconEval Contributors" }
]
dependencies = [
  "pydantic>=2.0",
  "numexpr>=2.14",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5.0",
]
stats = [
  "statsmodels>=0.14",
]
pdf = [
  "weasyprint>=62",
]

[project.scripts]
econeval = "econeval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["econeval"]
