name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .[dev]

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: pytest --cov=econeval --cov-report=term-missing --cov-fail-under=80

      - name: Run EconEval against the example model
        run: >
          econeval
          --config examples/basic_model/econeval.yml
          --model examples/basic_model/model.py
          --class DemoModel
          --report econeval-report.json

      - name: Upload EconEval report
        uses: actions/upload-artifact@v4
        with:
          name: econeval-report-py${{ matrix.python-version }}
          path: econeval-report.json
