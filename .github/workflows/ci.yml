name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest

      - name: Run EconEval against the example model
        run: >
          econeval
          --config examples/basic_model/econeval.yml
          --model examples/basic_model/model.py
          --class DemoModel
          --report econeval-report.json

      - name: Upload EconEval report
        uses: actions/upload-artifact@v4
        with:
          name: econeval-report
          path: econeval-report.json

