name: Release

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest

      - name: Run EconEval against the example model
        run: >
          econeval
          --config examples/basic_model/econeval.yml
          --model examples/basic_model/model.py
          --class DemoModel
          --report econeval-release-report.json

      - name: Upload EconEval release report
        uses: actions/upload-artifact@v4
        with:
          name: econeval-release-report
          path: econeval-release-report.json

