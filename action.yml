name: EconEval
description: Run EconEval against a model from a GitHub workflow.
author: Faruk Abdullahi

inputs:
  config:
    description: Path to the EconEval YAML config in the caller repository.
    required: true
  model:
    description: Path to the Python file that defines the model.
    required: true
  class:
    description: Model class name to instantiate.
    required: false
    default: DemoModel
  report:
    description: Path to the report file to write.
    required: false
    default: econeval-report.json
  format:
    description: Report format to write.
    required: false
    default: json
  python-version:
    description: Python version used to run EconEval.
    required: false
    default: "3.11"
  extra-args:
    description: Additional arguments passed to econeval.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install EconEval
      shell: bash
      run: python -m pip install -e "${{ github.action_path }}"

    - name: Run EconEval
      shell: bash
      working-directory: ${{ github.workspace }}
      run: >
        python -m econeval
        --config "${{ inputs.config }}"
        --model "${{ inputs.model }}"
        --class "${{ inputs.class }}"
        --report "${{ inputs.report }}"
        --format "${{ inputs.format }}"
        ${{ inputs.extra-args }}
