project: policy-model
version: 1

invariants:
  - name: policy_score_non_negative
    expression: model.policy_score >= 0
  - name: redistribution_index_reasonable
    expression: model.redistribution_index >= 0.5
  - name: elasticity_remains_negative
    expression: model.elasticity < 0

stress_tests:
  - name: policy_response
    dataset: data/fairness.csv
    metric: mape
    threshold: 0.25

economic_checks:
  - name: policy_signal_monotonicity
    kind: monotonicity
    method: predict
    variable: policy_shift
    lower: 0.0
    upper: 1.0
    direction: nondecreasing

fairness:
  enabled: true
  dataset: data/fairness.csv
  group_column: group
  positive_threshold: 1.5
  actual_threshold: 1.0
  metrics:
    - demographic_parity_difference
    - gini
    - equal_opportunity_difference
